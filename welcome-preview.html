<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTvTU 欢迎页 — VS 2022 风格预览</title>
<style>
:root {
  --bg: #2d2d30;
  --sidebar: #262628;
  --card: #3e3e42;
  --text: #f1f1f1;
  --text2: #ababab;
  --border: #434346;
  --accent: #8b3a62;
  --accent-hover: #a94b7b;
  --hover: #404045;
  --input: #333337;
  --purple: #b1467e;
  --radius: 0;
}
body.light {
  --bg: #f5f5f5;
  --sidebar: #ececec;
  --card: #ffffff;
  --text: #1e1e1e;
  --text2: #666;
  --border: #e0e0e0;
  --accent: #8b3a62;
  --accent-hover: #a94b7b;
  --hover: #f0f0f0;
  --input: #ffffff;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column;
}

/* ── Chrome bar ── */
.chrome {
  height: 32px; background: var(--sidebar); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  font-size: 12px; -webkit-app-region: drag;
}
.chrome-title { display: flex; align-items: center; gap: 8px; }
.chrome-btns button { width: 46px; height: 32px; border: none; background: none; color: var(--text); font-size: 12px; cursor: pointer; }
.chrome-btns .close:hover { background: #e81123; color: #fff; }

/* ── Toolbar ── */
.tb {
  position: fixed; top: 40px; right: 12px; z-index: 999;
  display: flex; gap: 4px;
}
.tb button, .tb select {
  padding: 4px 8px; font-size: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); border-radius: 2px; cursor: pointer;
}

/* ── Layout ── */
.main { flex:1; display: flex; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
  padding: 20px 0; display: flex; flex-direction: column;
}
.side-logo { padding: 0 24px; margin-bottom: 24px; }
.side-logo .name { font-size: 13px; font-weight: 600; color: var(--purple); margin-bottom: 2px; }
.side-logo .ver { font-size: 10px; color: var(--text2); }
.side-section { padding: 0 24px; margin-bottom: 16px; }
.side-section .title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin-bottom: 8px; }
.side-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 24px; font-size: 13px; cursor: pointer; color: var(--text);
  border-left: 3px solid transparent; transition: .1s;
}
.side-item:hover { background: var(--hover); }
.side-item.active { border-left-color: var(--purple); background: var(--hover); }
.side-item .icon { width: 16px; text-align: center; opacity: .7; font-size: 14px; }
.side-spacer { flex:1; }
.side-bottom { border-top: 1px solid var(--border); padding-top: 12px; }

/* ── Content (right) ── */
.content { flex:1; padding: 20px 32px; overflow-y: auto; display: flex; flex-direction: column; }

/* Search */
.search-wrap { margin-bottom: 16px; }
.search-input {
  width: 100%; max-width: 500px; padding: 8px 12px;
  background: var(--input); border: 1px solid var(--border); color: var(--text);
  font-size: 13px; outline: none;
}
.search-input:focus { border-color: var(--purple); }
.search-input::placeholder { color: var(--text2); }

/* Section header */
.sec-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.sec-sub { font-size: 11px; color: var(--text2); margin-bottom: 12px; }

/* Recent list */
.recent-list { max-width: 600px; }
.recent-item {
  display: flex; align-items: center; padding: 10px 12px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 2px;
}
.recent-item:hover {
  background: var(--card); border-color: var(--border);
}
.recent-item .file-icon {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-right: 12px; flex-shrink: 0;
}
.recent-item .info { flex:1; min-width: 0; }
.recent-item .name { font-size: 14px; line-height: 1.4; }
.recent-item .path { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent-item .meta { font-size: 10px; color: var(--text2); text-align: right; flex-shrink: 0; margin-left: 16px; }
.recent-item .badge {
  font-size: 9px; padding: 1px 6px; border-radius: 2px;
  background: var(--purple); color: #fff; display: inline-block; margin-bottom: 2px;
}

/* Empty state */
.empty { text-align: center; padding: 40px 0; color: var(--text2); }
.empty .big { font-size: 36px; margin-bottom: 12px; opacity: .4; }

/* Templates */
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 8px; max-width: 600px; }
.tpl-card {
  padding: 16px; border: 1px solid var(--border); cursor: pointer; transition: .1s;
  display: flex; align-items: center; gap: 10px;
}
.tpl-card:hover { border-color: var(--purple); background: var(--card); }

/* Responsive */
@media (max-width: 700px) {
  .sidebar { width: 200px; }
}
</style>
</head>
<body class="light">

<div class="chrome">
  <span class="chrome-title">UTvTU</span>
  <div class="chrome-btns"><button>─</button><button>□</button><button class="close">✕</button></div>
</div>
<div class="tb">
  <button onclick="document.body.classList.toggle('light')">🌓 切换深浅</button>
</div>

<div class="main">
  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <div class="side-logo">
      <div class="name">UTvTU</div>
      <div class="ver">v0.1.568</div>
    </div>
    <div class="side-section">
      <div class="title">开始</div>
    </div>
    <div class="side-item active" onclick="switchTab(this,'recent')">
      <span class="icon">📄</span> 最近项目
    </div>
    <div class="side-item" onclick="switchTab(this,'new')">
      <span class="icon">✨</span> 新建项目
    </div>
    <div class="side-item" onclick="switchTab(this,'open')">
      <span class="icon">📂</span> 打开项目
    </div>
    <div class="side-item" onclick="switchTab(this,'templates')">
      <span class="icon">🔰</span> 从模板新建
    </div>
    <div class="side-spacer"></div>
    <div class="side-bottom">
      <div class="side-item" onclick="alert('偏好设置')">
        <span class="icon">⚙</span> 偏好设置
      </div>
      <div class="side-item" onclick="alert('包管理器')">
        <span class="icon">📦</span> 包管理器
      </div>
    </div>
  </div>

  <!-- ── Content ── -->
  <div class="content" id="content"></div>
</div>

<script>
const recent = [
  { name:'My Song.ustx', dir:'D:\\Projects\\Music', fmt:'USTX', time:'今天 14:22' },
  { name:'Cover.ustxp', dir:'D:\\Projects\\Music', fmt:'USTXP', time:'昨天 09:15' },
  { name:'Original.ustx', dir:'C:\\Users\\Me\\Music', fmt:'USTX', time:'3 天前' },
  { name:'Test Project.ustx', dir:'D:\\OpenUTAU\\Projects', fmt:'USTX', time:'1 周前' },
  { name:'Demo Song.ustx', dir:'D:\\Music\\Covers', fmt:'USTX', time:'2 周前' },
];
const templates = [
  { name:'默认模板', desc:'空项目，标准 4/4 拍，120 BPM' },
  { name:'VST 测试项目', desc:'预加载 VST 效果链的测试项目' },
  { name:'多轨合唱', desc:'4 条歌声轨 + 混音设置' },
];

function switchTab(el, tab) {
  document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  const c = document.getElementById('content');
  if (tab === 'recent') {
    c.innerHTML = `
      <div class="search-wrap">
        <input class="search-input" placeholder="搜索最近项目..." oninput="filterRecent(this.value)">
      </div>
      <div class="sec-title">最近项目</div>
      <div class="sec-sub">双击打开项目，或从菜单 文件 → 打开 浏览</div>
      <div class="recent-list" id="recentList">
        ${recent.map(r => `
          <div class="recent-item" data-name="${r.name.toLowerCase()}">
            <div class="file-icon">📄</div>
            <div class="info">
              <div class="name">${r.name}</div>
              <div class="path">${r.dir}</div>
            </div>
            <div class="meta">
              <div class="badge">${r.fmt}</div>
              <div>${r.time}</div>
            </div>
          </div>`).join('')}
      </div>
      <div id="noResults" style="display:none" class="empty">
        <div class="big">🔍</div>
        <div>没有匹配的项目</div>
      </div>`;
  } else if (tab === 'new') {
    c.innerHTML = `
      <div class="sec-title">新建项目</div>
      <div class="sec-sub">创建一个空白的歌声合成项目</div>
      <div style="display:flex;gap:12px;margin-bottom:20px">
        <button onclick="alert('新建')" style="padding:10px 24px;background:var(--purple);color:#fff;border:none;font-size:13px;cursor:pointer">✨ 新建空白项目</button>
        <button onclick="alert('快捷')" style="padding:10px 24px;background:var(--card);color:var(--text);border:1px solid var(--border);font-size:13px;cursor:pointer">Ctrl+N</button>
      </div>`;
  } else if (tab === 'open') {
    c.innerHTML = `
      <div class="sec-title">打开项目</div>
      <div class="sec-sub">浏览本地文件系统中的项目文件</div>
      <div style="display:flex;gap:12px;margin-bottom:20px">
        <button onclick="alert('打开')" style="padding:10px 24px;background:var(--card);color:var(--text);border:1px solid var(--border);font-size:13px;cursor:pointer">📂 浏览文件</button>
        <span style="color:var(--text2);font-size:11px;align-self:center">支持 .ustx / .ustxp / .ust / .mid / .vsqx</span>
      </div>
      <div class="sec-title" style="margin-top:20px">最近项目</div>
      <div class="recent-list">
        ${recent.map(r => `
          <div class="recent-item">
            <div class="file-icon">📄</div>
            <div class="info">
              <div class="name">${r.name}</div>
              <div class="path">${r.dir}</div>
            </div>
            <div class="meta"><div class="badge">${r.fmt}</div><div>${r.time}</div></div>
          </div>`).join('')}
      </div>`;
  } else if (tab === 'templates') {
    c.innerHTML = `
      <div class="sec-title">从模板新建</div>
      <div class="sec-sub">选择一个模板快速开始项目</div>
      <div class="tpl-grid">
        ${templates.map(t => `
          <div class="tpl-card" onclick="alert('模板: ${t.name}')">
            <span style="font-size:20px">🔰</span>
            <div>
              <div style="font-size:13px">${t.name}</div>
              <div style="font-size:10px;color:var(--text2)">${t.desc}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }
}
function filterRecent(q) {
  document.querySelectorAll('.recent-item').forEach(el => {
    el.style.display = el.dataset.name.includes(q.toLowerCase()) ? '' : 'none';
  });
  const visible = [...document.querySelectorAll('.recent-item')].some(e => e.style.display !== 'none');
  document.getElementById('noResults').style.display = visible ? 'none' : '';
}

switchTab(document.querySelector('.side-item.active'), 'recent');
</script>
</body>
</html>
